<!DOCTYPE = "html">
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
    <!-- google font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bitcount+Ink:wght@100..900&display=swap" rel="stylesheet">
    <!-- stylesheet-->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="../styles.css">
</head>
<body>
    <header>
        <div class="menu">
            <h1>Form page practicing</h1>
            <nav >
                <ul class="container">
                    <li class="item"><a href="../index.html"><i class="fa-solid fa-house"></i> home</a></li>
                    <li class="item"><a href="./form.html"><i class="fa-solid fa-pen"></i> form</a></li>
                    <li class="item"><a href="./about.html"><i class="fa-solid fa-circle-info"></i> about</a></li>
                </ul>
            </nav>
        </div>
    </header>
    <main>
        <div class="box">
            <form action="./index.html" method="post" target="_self">
                <label for="name">Name: </label>
                <input type="text" id="name" name="name">
                <br>
                <label for="lastname">Lastname: </label>
                <input type="text" id="lastname" name="lastname">
                <br>
                <label for="dni">Dni: </label>
                <input type="number" id="dni" name="dni">
                <br>
                <label for="date-of-birth">Date of Birth</label>
                <input type="date" id="date-of-birth" name="date of birth">
                <br>
                <label for="email">E-mail: </label>
                <input type="email" id="email" name="e-mail">
                <br>
                <label for="pass">Password: </label>
                <input type="password" id="pass" name="password">
                <br>
                <button type="reset" class="button button-reset">Reset</button>
                <button type="submit" class="button button-submit" >Submit</button>
            </form>
        </div>
    </main>
    <footer>

    </footer>
</body>
</html>
